name: Build iOS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Clean build
        run: flutter clean

      - name: Update CocoaPods repo
        run: |
          cd ios
          pod repo update
          # Clean pods to ensure fresh install
          rm -rf Pods Podfile.lock
          cd ..

      - name: Check iOS environment
        run: |
          xcode-select -p
          flutter precache --ios
          flutter doctor -v
          echo "iOS environment check complete"

      - name: Regenerate iOS build files
        run: |
          cd ios
          rm -rf Pods Podfile.lock .symlinks/ Flutter/Flutter.framework Flutter/Flutter.podspec
          cd ..
          flutter clean
          flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign -v 2>&1 | tail -100

      - name: Upload iOS build to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/iphoneos/Runner.app
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body: |
            🎉 **新しいリリース: ${{ github.ref_name }}**

            ## iOS ビルド完了
            - **ビルドアーキテクチャ**: ARM64
            - **ビルドモード**: Release
            - **最小 iOS バージョン**: 12.0

            ## インストール方法
            このビルドは開発用成果物です。
            本番環境では TestFlight または App Store からインストールしてください。

            ## 変更内容
            このビルドに含まれる最新の実装：
            - ✅ ステップ実行・デバッグ機能
            - ✅ 変数ビューアー
            - ✅ ブレークポイント
            - ✅ 自動採点
            - ✅ 実行履歴・リプレイ
            - ✅ マルチランゲージ対応
            - ✅ 自動 APK ビルド

            詳細は [PR #23](https://github.com/${{ github.repository }}/pull/23) を参照してください。

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release Build (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_ios:
        description: 'iOSビルドも実行する（署名未設定のため通常は失敗します。Androidだけで良い場合はオフのまま）'
        type: boolean
        default: false

# Limit permissions to minimum required (security best practice)
permissions:
  contents: write
  checks: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2  # v4.0.0

      - name: Setup Flutter
        uses: subosito/flutter-action@7814e4f6c70abd7a5641333f613efa098fe34381  # v2.14.0
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        env:
          # Environment variables for flutter_dotenv fallback
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: success()
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest
    # タグpush時（正式リリース）は常に実行。手動実行(workflow_dispatch)時は
    # build_ios 入力が true の場合のみ実行（署名未設定のため通常は失敗する）。
    if: github.event_name == 'push' || inputs.build_ios == true

    steps:
      - name: Checkout code
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2  # v4.0.0

      - name: Setup Flutter
        uses: subosito/flutter-action@7814e4f6c70abd7a5641333f613efa098fe34381  # v2.14.0
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS App (Release)
        run: |
          flutter build ios --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
        env:
          # Environment variables for flutter_dotenv fallback
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: success()
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app

  verify:
    name: Verify Build Success
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    # build-ios は手動実行時にスキップされうるため、その場合も
    # build-android の成功だけで verify を通す。
    if: |
      always() &&
      needs.build-android.result == 'success' &&
      (needs.build-ios.result == 'success' || needs.build-ios.result == 'skipped')

    steps:
      - name: Build verification
        run: |
          if [ "${{ needs.build-ios.result }}" = "skipped" ]; then
            echo "✅ Android APK built successfully! (iOS build skipped for this manual run)"
          else
            echo "✅ Android APK and iOS app built successfully!"
          fi

# Security notes:
# - All 3rd-party actions are pinned to specific commit SHA (not version tags)
# - Environment secrets are passed as dart-define flags and env vars
# - Permissions limited to minimum required (contents write, checks write)
# - No checkout of untrusted code; uses official Flutter action
# - Artifacts uploaded for testing and distribution

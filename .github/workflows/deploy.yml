name: Release Build (Android & iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g., v0.1.0)'
        required: false
        type: string

# Limit permissions to minimum required (security best practice)
permissions:
  contents: write
  checks: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20f10a21f43b30e5bbdc72f4f04c02e75c57c  # v4.0.0

      - name: Setup Java
        uses: actions/setup-java@b36c23c0d45c41e40d352c7286cf7196c94f91d6  # v4.0.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@db9f90a3c7e67c82fb80146d312b6699e5dff5c8  # v2.14.0
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_ANDROID_APP_ID=${{ secrets.FIREBASE_ANDROID_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}
        env:
          # Environment variables for flutter_dotenv fallback
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15585d3d07a24e92  # v3.1.3
        if: success()
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@e2f20f10a21f43b30e5bbdc72f4f04c02e75c57c  # v4.0.0

      - name: Setup Flutter
        uses: subosito/flutter-action@db9f90a3c7e67c82fb80146d312b6699e5dff5c8  # v2.14.0
        with:
          flutter-version: '3.x'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS App (Release)
        run: |
          flutter build ios --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_IOS_APP_ID=${{ secrets.FIREBASE_IOS_APP_ID }} \
            --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} \
            --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }} \
            --dart-define=FIREBASE_IOS_BUNDLE_ID=${{ secrets.FIREBASE_IOS_BUNDLE_ID }}
        env:
          # Environment variables for flutter_dotenv fallback
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_IOS_APP_ID: ${{ secrets.FIREBASE_IOS_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_IOS_BUNDLE_ID: ${{ secrets.FIREBASE_IOS_BUNDLE_ID }}

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15585d3d07a24e92  # v3.1.3
        if: success()
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app

  verify:
    name: Verify Build Success
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: success()

    steps:
      - name: Build verification
        run: echo "✅ Android APK and iOS app built successfully!"

# Security notes:
# - All 3rd-party actions are pinned to specific commit SHA (not version tags)
# - Environment secrets are passed as dart-define flags and env vars
# - Permissions limited to minimum required (contents write, checks write)
# - No checkout of untrusted code; uses official Flutter action
# - Artifacts uploaded for testing and distribution

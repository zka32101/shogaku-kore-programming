name: Build APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            🎉 **新しいリリース: ${{ github.ref_name }}**

            ## APK ビルド完了
            - **ビルドアーキテクチャ**: ARM64
            - **ビルドモード**: Release
            - **最小 SDK**: 21
            - **ターゲット SDK**: 34

            ## インストール方法
            1. APK ファイルをダウンロード
            2. Android デバイスで実行してインストール
            3. アプリを起動

            ## 変更内容
            このビルドに含まれる最新の実装：
            - ✅ ステップ実行・デバッグ機能
            - ✅ 変数ビューアー
            - ✅ ブレークポイント
            - ✅ 自動採点
            - ✅ 実行履歴・リプレイ
            - ✅ マルチランゲージ対応

            詳細は [PR #22](https://github.com/${{ github.repository }}/pull/22) を参照してください。

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Auto Build & Release

on:
  push:
    branches:
      - main
    paths:
      - 'pubspec.yaml'
      - 'lib/**'
      - '.github/workflows/auto-build.yml'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should-build: ${{ steps.check-tag.outputs.should-build }}
    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2  # v4.0.0
        with:
          fetch-depth: 0

      - name: Get version from pubspec.yaml
        id: get-version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: \(.*\)+.*/\1/')
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: v${VERSION}"

      - name: Check if tag exists
        id: check-tag
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: \(.*\)+.*/\1/')
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Tag v${VERSION} already exists, skipping build"
          else
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "🚀 New version detected, proceeding with build"
          fi

  create-release:
    needs: version-check
    if: needs.version-check.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1e31de5234b9f8995739874a8ce0492dc87873e2  # v4.0.0

      - name: Create Git tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a ${{ needs.version-check.outputs.version }} -m "Release ${{ needs.version-check.outputs.version }}"
          git push origin ${{ needs.version-check.outputs.version }}
          gh release create ${{ needs.version-check.outputs.version }} --title "Release ${{ needs.version-check.outputs.version }}" --notes "Automatic release triggered by version change in pubspec.yaml. Build artifacts will be available once the build workflow completes."

  build-status:
    needs: [version-check, create-release]
    runs-on: ubuntu-latest
    if: needs.version-check.outputs.should-build == 'true'
    steps:
      - name: Notify build started
        run: |
          echo "✅ Release ${{ needs.version-check.outputs.version }} created"
          echo "🔨 Build workflow will start automatically"
          echo "📱 APK and iOS builds in progress..."

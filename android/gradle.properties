org.gradle.jvmargs=-Xmx3072m -XX:+UseSerialGC
android.useAndroidX=true
org.gradle.daemon=false
# ワーカー並列数を制限し、CI環境（メモリ上限の低いランナー）での
# 「Gradle build daemon has been stopped: JVM garbage collector is
# thrashing」（GCスラッシングによるビルド失敗）を防ぐ
org.gradle.workers.max=2
# パスに日本語（マイドライブ）を含む場合に必要
android.overridePathCheck=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# CMake staging dir (avoid Japanese path issues)
android.cxx.buildStagingDirectory=C\:\\cxx\\shogaku-kore-programming


# これまで9回連続でCI上のビルドが "JVM garbage collector is
# thrashing" で失敗している。メモリ診断ログでは、失敗直前でも
# システム全体のメモリは全く逼迫していない(15GB中13GB利用可能)
# ことが確認できたため、単純な物理メモリ不足ではなく、
# SerialGC(単一スレッドの単純なGC)が大きめのヒープに対して
# 非効率で、フルGCに時間がかかりすぎて「GCに時間を取られすぎ」
# と誤検出されている可能性が高いと判断。より現代的で並行処理に
# 強い G1GC に変更する。
org.gradle.jvmargs=-Xmx3072m -XX:+UseG1GC
android.useAndroidX=true
org.gradle.daemon=false
# ワーカーを直列実行(max=1)にする。max=2 の場合、各ワーカーが
# 個別に org.gradle.jvmargs のヒープを要求しうるため、実効メモリ
# 要求量がヒープ設定値の倍近くまで膨らみ、GCスラッシングが
# 解消しなかった（2048m~7168mまで何度増やしても再発した）。
# ワーカー数を1に絞ることで、実効メモリ要求量をヒープ設定値
# そのものに近づける。
org.gradle.workers.max=1
# Kotlinコンパイラは Gradle 本体とは別の独立した「Kotlinデーモン」
# プロセスとして実行され、org.gradle.jvmargs のヒープ設定は
# このプロセスには継承されない。workers.max=1 にしても失敗時の
# orphan process 一覧に java プロセスが2つ(Gradle本体 + Kotlin
# デーモン)残っていたことから、これが GCスラッシングの実際の
# 発生源である可能性が高いと判断し、明示的にヒープを指定する。
kotlin.daemon.jvm.options=-Xmx2048m,-XX:+UseG1GC
# パスに日本語（マイドライブ）を含む場合に必要
android.overridePathCheck=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# CMake staging dir (avoid Japanese path issues)
android.cxx.buildStagingDirectory=C\:\\cxx\\shogaku-kore-programming

